version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: cloudquill_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudquill_backend
    ports:
      - "5000:5000"
    environment:
      # Injecting the MongoDB URI to connect to the mongodb service container
      - MONGO_URI=mongodb://mongodb:27017/cloudquill
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudquill_frontend
    ports:
      - "3000:80" # Map host port 3000 to nginx internal port 80
    depends_on:
      - backend

volumes:
  mongo-data:
